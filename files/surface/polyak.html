<!doctype html>
<html>
	<head>
		<meta charset = "utf-8"/>
		<meta name = "viewport" content = "width=device-width, initial-scale=1"/>
		<title>polyak</title>
		<script type = "text/x-mathjax-config">
			MathJax.Hub.Config({
				messageStyle: "none",
				showProcessingMessages: false,
				SVG: {font: "TeX"},
				tex2jax: {inlineMath: [["$", "$"], ["\\(", "\\)"]]}
			});
		</script>
		<script src = "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-AMS-MML_SVG"></script>
		<script>
			window.PlotlyConfig = {MathJaxConfig: "local"};
		</script>
		<script src = "https://cdn.plot.ly/plotly-3.5.0.min.js"></script>
		<style>
			@font-face {
				font-family: "Latin Modern Roman Web";
				font-style: normal;
				font-weight: 400;
				src: url("lmroman10-regular.otf") format("opentype");
			}

			@font-face {
				font-family: "Latin Modern Math Web";
				font-style: normal;
				font-weight: 400;
				src: url("latinmodern-math.otf") format("opentype");
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: #ffffff;
			}

			body {
				color: #111111;
				font-family: "Latin Modern Roman Web", "Latin Modern Math Web", "Latin Modern Roman", "Computer Modern Serif", "CMU Serif", serif;
			}

			#surface-page {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 330px;
				width: 100%;
				height: 100%;
			}

			#surface-plot {
				min-width: 0;
				min-height: 0;
			}

			#surface-legend {
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 16px;
			}

			.legend-title {
				margin-bottom: 12px;
				font-size: 15px;
				line-height: 1.5;
				text-align: center;
			}

			.legend-item {
				display: flex;
				align-items: center;
				gap: 10px;
				width: 100%;
				padding: 6px 0;
				border: 0;
				background: none;
				color: inherit;
				font: inherit;
				font-size: 15px;
				text-align: left;
				cursor: pointer;
			}

			.legend-item[aria-pressed="false"] { opacity: 0.4; }
			.legend-line { flex: none; width: 24px; border-top: 3px solid; }

			@media (max-width: 700px) {
				#surface-page { display: flex; flex-direction: column; height: auto; min-height: 100%; }
				#surface-plot { flex: none; height: min(52dvh, 560px); min-height: 330px; }
				#surface-legend { padding: 4px 20px 20px; }
				.legend-title { margin-bottom: 8px; }
				.legend-item { padding: 5px 0; }
			}

			#surface-loader {
				position: fixed;
				inset: 0;
				z-index: 30;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #ffffff;
				opacity: 1;
				pointer-events: none;
				transition: opacity 240ms ease;
			}

			#surface-loader.hidden {
				opacity: 0;
			}

			#surface-loader-panel {
				width: min(360px, 58vw);
			}

			#surface-loader-track {
				width: 100%;
				height: 1px;
				overflow: hidden;
				background: rgba(0, 0, 0, 0.14);
			}

			#surface-loader-bar {
				width: 42%;
				height: 1px;
				background: #272727;
				animation: surface-load-bar 1000ms ease-in-out infinite;
			}

			@keyframes surface-load-bar {
				from {
					transform: translateX(-110%);
				}

				to {
					transform: translateX(250%);
				}
			}

			.MathJax_SVG,
			.MathJax_SVG_Display {
				font-size: 100% !important;
			}
		</style>
	</head>
	<body>
		<main id = "surface-page">
			<div id = "surface-plot"></div>
			<aside id = "surface-legend" aria-label = "plot legend">
				<div class = "legend-title">$\mathcal{L}(p,n) = \frac{1}{2}n^T H(p)\,n$<br>$\mathcal{L}: \mathbb{R}^2 \to \mathbb{R}$</div>
			</aside>
		</main>
		<div id = "surface-loader" aria-label = "Loading">
			<div id = "surface-loader-panel">
				<div id = "surface-loader-track">
					<div id = "surface-loader-bar"></div>
				</div>
			</div>
		</div>
		<script>
			let loaderStart = Date.now();
			const surfaceDataUrl = "data.js";

			function hideLoader() {
				const loader = document.getElementById("surface-loader");
				if (!loader || loader.dataset.hidden === "1") {
					return;
				}
				const delay = Math.max(0, 1000 - (Date.now() - loaderStart));
				window.setTimeout(function() {
					loader.dataset.hidden = "1";
					loader.classList.add("hidden");
					window.setTimeout(function() {
						loader.style.display = "none";
					}, 260);
				}, delay);
			}

			function renderLegend(plot, traces) {
				const legend = document.getElementById("surface-legend");
				traces.forEach(function(trace, index) {
					if (!trace.showlegend) return;
					const indices = traces.flatMap(function(other, otherIndex) {
						return otherIndex === index || (trace.legendgroup && other.legendgroup === trace.legendgroup) ? [otherIndex] : [];
					});
					const button = document.createElement("button");
					button.className = "legend-item";
					button.type = "button";
					button.setAttribute("aria-pressed", "true");
					const line = document.createElement("span");
					line.className = "legend-line";
					line.style.borderColor = trace.line.color;
					const label = document.createElement("span");
					label.textContent = trace.name;
					button.append(line, label);
					button.addEventListener("click", function() {
						const visible = button.getAttribute("aria-pressed") !== "true";
						Plotly.restyle(plot, {visible: visible ? true : "legendonly"}, indices);
						button.setAttribute("aria-pressed", String(visible));
					});
					legend.appendChild(button);
				});
			}

			function renderSurface() {
				const figure = window.surfaceFigure;
				const config = window.surfaceConfig;
				Plotly.newPlot("surface-plot", figure.data, {...figure.layout, showlegend: false}, config).then(function(plot) {
					renderLegend(plot, figure.data);
					if (window.MathJax && window.MathJax.Hub) {
						window.MathJax.Hub.Queue(["Typeset", window.MathJax.Hub], hideLoader);
					} else {
						hideLoader();
					}
				});
			}

			function loadSurfaceData() {
				loaderStart = Date.now();
				const script = document.createElement("script");
				script.src = surfaceDataUrl;
				script.onload = function() {
					document.fonts.ready.then(renderSurface);
				};
				document.body.appendChild(script);
			}

			window.addEventListener("load", function() {
				window.requestAnimationFrame(function() {
					window.requestAnimationFrame(loadSurfaceData);
				});
			});
		</script>
	</body>
</html>
